<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WTM — Daily Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0F2EE;
    --panel: #FFFFFF;
    --ink: #24291F;
    --ink-soft: #5B6156;
    --line: #DADFD5;
    --flag: #7A3B4C;
    --flag-bg: #F5E9EB;
    --clean: #4C7A63;
    --accent: #24291F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 96px; }

  h1 {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .subhead {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 40px;
  }

  /* --- Login gate --- */
  #login {
    max-width: 340px;
    margin: 120px auto 0;
    text-align: center;
  }
  #login h1 { font-size: 28px; }
  #login p { color: var(--ink-soft); font-size: 14px; margin-bottom: 28px; }
  .field-row {
    display: flex;
    gap: 8px;
  }
  input[type="password"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    font-size: 15px;
    color: var(--ink);
    font-family: inherit;
  }
  input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 3px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .error-msg { color: var(--flag); font-size: 13px; margin-top: 14px; min-height: 18px; }

  /* --- App --- */
  #app { display: none; }

  .date-picker {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .date-picker label { font-size: 13px; color: var(--ink-soft); }
  select {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    color: var(--ink);
  }
  .refresh-link {
    margin-left: auto;
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  .summary-line {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 28px;
  }
  .summary-line strong { color: var(--ink); font-weight: 600; }

  .client {
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
  }
  .client:last-child { border-bottom: none; }
  .client-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .client-name {
    font-size: 17px;
    font-weight: 600;
  }
  .client-status {
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: lowercase;
  }
  /* --- Headline signals ---
     Two indicator sets that must never be confused with each other:
     check-in uses a SQUARE, activity uses a CIRCLE, and both carry a
     text label, so neither colour nor shape alone has to do the work. */
  .signals {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0 8px;
  }
  .signal {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    white-space: nowrap;
  }
  .mark {
    width: 10px;
    height: 10px;
    flex: none;
    background: var(--sig, var(--ink-soft));
  }
  .checkin .mark, .checkin-mark { border-radius: 2px; }       /* square */
  .activity .mark, .activity-mark { border-radius: 50%; }     /* circle */
  .signal .label { color: var(--ink-soft); }
  .signal .value { font-weight: 600; }
  .signal .days { color: var(--ink-soft); }

  .sig-green  { --sig: #4C7A63; }
  .sig-amber  { --sig: #B8860B; }
  .sig-orange { --sig: #C2662E; }
  .sig-red    { --sig: #A63D4E; }
  .sig-grey   { --sig: #9AA095; }
  .sig-red .value  { color: var(--flag); }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-soft);
    margin: -14px 0 26px;
  }
  .legend span.mark { display: inline-block; vertical-align: middle; margin-right: 5px; background: var(--ink-soft); }

  /* Secondary detail: still useful, deliberately not the primary scan. */
  .items { list-style: none; margin: 4px 0 0; padding: 0; }
  .items li {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    padding: 1px 0;
  }
  .items li::before { content: "— "; color: var(--line); }
  .all-clear {
    font-size: 13px;
    color: var(--clean);
  }

  .empty-state {
    text-align: center;
    padding: 60px 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="login">
  <h1>WTM — Daily Check</h1>
  <p>Client status and what needs attention today.</p>
  <div class="field-row">
    <input type="password" id="pw" placeholder="Password" autofocus />
    <button id="loginBtn" onclick="attemptLogin()">View</button>
  </div>
  <div class="error-msg" id="loginError"></div>
</div>

<div id="app">
  <div class="wrap">
    <h1>WTM — Daily Check</h1>
    <p class="subhead">Client status, pulled from Trainerize twice daily.</p>

    <div class="date-picker">
      <label for="dateSelect">Showing</label>
      <select id="dateSelect" onchange="renderForSelectedDate()"></select>
      <button class="refresh-link" onclick="loadData()">Refresh</button>
    </div>

    <div class="summary-line" id="summaryLine"></div>
    <div class="legend">
      <span><span class="mark checkin-mark"></span>square = weekly check-in</span>
      <span><span class="mark activity-mark"></span>circle = activity</span>
    </div>
    <div id="clientList"></div>
  </div>
</div>

<script>
  // --- Configure these two before hosting ---
  const FUNCTION_URL = 'https://nvkwgsbkscjyretlyfrk.supabase.co/functions/v1/dashboard-data';
  const ANON_KEY = 'sb_publishable_D7vOGBfH3q08YRMjP4XlrQ_mU6sGXmW';
  // -------------------------------------------

  let allRows = [];
  let storedPassword = '';

  function attemptLogin() {
    const pw = document.getElementById('pw').value;
    if (!pw) return;
    storedPassword = pw;
    loadData();
  }

  document.getElementById('pw').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
  });

  async function loadData() {
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
    if (errEl) errEl.textContent = '';

    try {
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': ANON_KEY,
        },
        body: JSON.stringify({ password: storedPassword }),
      });

      if (res.status === 401) {
        if (errEl) errEl.textContent = 'Incorrect password.';
        if (btn) { btn.disabled = false; btn.textContent = 'View'; }
        return;
      }
      if (!res.ok) {
        if (errEl) errEl.textContent = 'Something went wrong loading data.';
        if (btn) { btn.disabled = false; btn.textContent = 'View'; }
        return;
      }

      const { rows } = await res.json();
      allRows = rows || [];

      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      populateDatePicker();
      renderForSelectedDate();
    } catch (e) {
      if (errEl) errEl.textContent = 'Could not reach the dashboard data.';
      if (btn) { btn.disabled = false; btn.textContent = 'View'; }
    }
  }

  function populateDatePicker() {
    const dates = [...new Set(allRows.map(r => r.sync_date))].sort().reverse();
    const select = document.getElementById('dateSelect');
    select.innerHTML = dates.map(d => `<option value="${d}">${formatDate(d)}</option>`).join('');
  }

  function formatDate(d) {
    const date = new Date(d + 'T00:00:00Z');
    return date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // Mirrors ACTIVITY_DAYS_CAP in trainerize_sync.py - anything at the cap
  // is displayed as "14d+" rather than an exact number.
  const ACTIVITY_DAYS_CAP = 14;

  // null on either signal means the calendar call failed for that client:
  // shown as "No data", never quietly rendered as a pass.
  const CHECKIN_META = {
    green: { cls: 'sig-green', text: 'Submitted' },
    amber: { cls: 'sig-amber', text: 'Due' },
    red:   { cls: 'sig-red',   text: 'Overdue' },
    'n/a': { cls: 'sig-grey',  text: 'No check-in cadence' },
  };
  const ACTIVITY_META = {
    active:  { cls: 'sig-green',  text: 'Active' },
    quiet_3: { cls: 'sig-amber',  text: 'Quiet 3–4d' },
    quiet_5: { cls: 'sig-orange', text: 'Quiet 5–6d' },
    quiet_7: { cls: 'sig-red',    text: 'Quiet 7d+' },
  };
  const NO_DATA = { cls: 'sig-grey', text: 'No data' };

  // Worse of the two signals decides where a client sits. Lower is more
  // urgent. Unknown data ranks high on purpose - a failed pull should be
  // noticed, not buried at the bottom next to the healthy clients.
  function urgencyRank(r) {
    if (r.checkin_light === 'red' || r.activity_tier === 'quiet_7') return 0;
    if (!r.checkin_light || !r.activity_tier) return 1;
    if (r.checkin_light === 'amber' || r.activity_tier === 'quiet_5') return 2;
    if (r.activity_tier === 'quiet_3') return 3;
    return 4;
  }

  function signalHtml(kind, label, meta, days) {
    const showDays = days !== null && days !== undefined;
    const plus = kind === 'activity' && days >= ACTIVITY_DAYS_CAP ? '+' : '';
    const daysHtml = showDays ? ` <span class="days">${days}d${plus}</span>` : '';
    return `<span class="signal ${kind} ${meta.cls}">`
      + `<span class="mark"></span>`
      + `<span class="label">${label}</span>`
      + `<span class="value">${escapeHtml(meta.text)}</span>${daysHtml}</span>`;
  }

  function renderForSelectedDate() {
    const selected = document.getElementById('dateSelect').value;
    const rows = allRows.filter(r => r.sync_date === selected);

    const needsAttention = rows.filter(
      r => urgencyRank(r) < 4
        || (r.headline_items && r.headline_items.length)
        || (r.action_items && r.action_items.length)
    );
    document.getElementById('summaryLine').innerHTML =
      rows.length === 0
        ? 'No data for this date.'
        : `<strong>${needsAttention.length}</strong> of <strong>${rows.length}</strong> clients need attention.`;

    const sorted = [...rows].sort((a, b) => {
      const byUrgency = urgencyRank(a) - urgencyRank(b);
      if (byUrgency !== 0) return byUrgency;
      const nameA = `${a.first_name || ''} ${a.last_name || ''}`.trim();
      const nameB = `${b.first_name || ''} ${b.last_name || ''}`.trim();
      return nameA.localeCompare(nameB);
    });

    const listEl = document.getElementById('clientList');
    if (sorted.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No client data for this date.</div>';
      return;
    }

    listEl.innerHTML = sorted.map(r => {
      const checkinMeta = CHECKIN_META[r.checkin_light] || NO_DATA;
      const activityMeta = ACTIVITY_META[r.activity_tier] || NO_DATA;
      // action_items holds only the secondary detail; the two headline
      // signals arrive in headline_items and are drawn as indicators
      // above. Disjoint lists, so no wording-dependent filtering here.
      const items = r.action_items || [];
      return `
      <div class="client">
        <div class="client-head">
          <span class="client-name">${escapeHtml(r.first_name || '')} ${escapeHtml(r.last_name || '')}</span>
          <span class="client-status">${escapeHtml(r.status || '')}</span>
        </div>
        <div class="signals">
          ${signalHtml('checkin', 'Check-in:', checkinMeta, r.days_since_checkin)}
          ${signalHtml('activity', 'Activity:', activityMeta, r.days_since_activity)}
        </div>
        ${
          items.length
            ? `<ul class="items">${items.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>`
            : ''
        }
      </div>
    `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
